user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $request_id lets a browser-reported error be tied to the exact backend
    # log line — the header is echoed back by AuditContextMiddleware.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time rid=$request_id';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;               # do not advertise the nginx version

    client_max_body_size 10m;        # matches FILE_UPLOAD_MAX_BYTES
    client_body_timeout 30s;
    client_header_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Rate limiting. Login is limited far more tightly than general API
    # traffic: it is the endpoint an attacker will hammer, and legitimate
    # users sign in a handful of times per day.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ---- HTTP: redirect everything except the ACME challenge -------------
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /health/ {
            proxy_pass http://backend;
            access_log off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS ----------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # TLS 1.2+ only. TLS 1.0/1.1 are deprecated and would fail a
        # security review for a system handling financial data.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # CSP: no inline script, no external origins. 'unsafe-inline' is
        # permitted for styles only because Tailwind and the PDF preview
        # inject style attributes; scripts have no such exemption.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        limit_conn perip 20;

        # Login: strict limiting, and no access log body to avoid recording
        # credentials in any form.
        location /api/v1/auth/login/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params_custom;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params_custom;
        }

        location /admin/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params_custom;
        }

        location /health/ {
            proxy_pass http://backend;
            access_log off;
        }

        location /ready/ {
            proxy_pass http://backend;
            access_log off;
        }

        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Media is served through the app, not directly: uploaded documents
        # may contain commercially sensitive data and must be authorised.
        location /media/ {
            internal;
            alias /var/www/media/;
        }

        location / {
            proxy_pass http://frontend;
            include /etc/nginx/proxy_params_custom;
        }
    }
}
